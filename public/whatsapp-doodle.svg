<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <style>
      .doodle { stroke: #000000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.08; }
      .doodle-fill { fill: #000000; opacity: 0.08; }
    </style>
  </defs>

  <!-- Sun & Solar -->
  <g class="doodle" transform="translate(30, 30)">
    <circle cx="20" cy="20" r="10" />
    <line x1="20" y1="4" x2="20" y2="8" />
    <line x1="20" y1="32" x2="20" y2="36" />
    <line x1="4" y1="20" x2="8" y2="20" />
    <line x1="32" y1="20" x2="36" y2="20" />
    <line x1="9" y1="9" x2="12" y2="12" />
    <line x1="28" y1="28" x2="31" y2="31" />
    <line x1="9" y1="31" x2="12" y2="28" />
    <line x1="28" y1="12" x2="31" y2="9" />
  </g>

  <!-- Chat Bubble -->
  <g class="doodle" transform="translate(130, 25)">
    <path d="M5 5h30a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H15l-8 7v-7H5a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4z" />
    <line x1="10" y1="13" x2="28" y2="13" />
    <line x1="10" y1="19" x2="22" y2="19" />
  </g>

  <!-- Coffee Mug -->
  <g class="doodle" transform="translate(240, 28)">
    <rect x="5" y="10" width="22" height="24" rx="3" />
    <path d="M27 15h5a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4h-5" />
    <path d="M11 6c0-2 2-3 2-4" />
    <path d="M16 6c0-2 2-3 2-4" />
  </g>

  <!-- Light Bulb -->
  <g class="doodle" transform="translate(330, 35)">
    <path d="M12 4a12 12 0 0 0-7 19c2 2 3 5 3 7h8c0-2 1-5 3-7a12 12 0 0 0-7-19z" />
    <line x1="9" y1="34" x2="15" y2="34" />
  </g>

  <!-- Green Leaf / Plant -->
  <g class="doodle" transform="translate(35, 120)">
    <path d="M5 35C5 20 18 5 35 5c0 18-15 30-30 30z" />
    <path d="M5 35C15 25 25 15 35 5" />
  </g>

  <!-- Heart -->
  <g class="doodle-fill" transform="translate(145, 125)">
    <path d="M15 27s-11-7-11-14a6 6 0 0 1 11-3 6 6 0 0 1 11 3c0 7-11 14-11 14z" />
  </g>

  <!-- Smartphone -->
  <g class="doodle" transform="translate(235, 115)">
    <rect x="5" y="3" width="20" height="34" rx="4" />
    <circle cx="15" cy="31" r="1.5" />
    <line x1="11" y1="7" x2="19" y2="7" />
  </g>

  <!-- Smiley Face -->
  <g class="doodle" transform="translate(330, 120)">
    <circle cx="18" cy="18" r="14" />
    <circle cx="13" cy="14" r="1.5" class="doodle-fill" />
    <circle cx="23" cy="14" r="1.5" class="doodle-fill" />
    <path d="M12 22c2 3 8 3 10 0" />
  </g>

  <!-- Paper Airplane / Send -->
  <g class="doodle" transform="translate(25, 215)">
    <path d="M3 18l32-15-15 32-4-12z" />
    <line x1="16" y1="23" x2="35" y2="3" />
  </g>

  <!-- Clock -->
  <g class="doodle" transform="translate(130, 215)">
    <circle cx="18" cy="18" r="14" />
    <polyline points="18,10 18,18 24,18" />
  </g>

  <!-- House / Rooftop -->
  <g class="doodle" transform="translate(235, 210)">
    <polyline points="5,18 20,5 35,18" />
    <rect x="9" y="18" width="22" height="18" />
    <rect x="15" y="24" width="10" height="12" />
  </g>

  <!-- Star -->
  <g class="doodle-fill" transform="translate(335, 215)">
    <polygon points="15,2 19,11 28,12 21,18 23,28 15,22 7,28 9,18 2,12 11,11" />
  </g>

  <!-- Music Note -->
  <g class="doodle" transform="translate(35, 305)">
    <ellipse cx="10" cy="28" rx="6" ry="4" />
    <ellipse cx="28" cy="24" rx="6" ry="4" />
    <polyline points="16,28 16,8 34,4 34,24" />
  </g>

  <!-- Lightning / Energy -->
  <g class="doodle" transform="translate(135, 300)">
    <polygon points="16,3 6,20 18,20 12,37 28,16 16,16" />
  </g>

  <!-- Thumbs Up -->
  <g class="doodle" transform="translate(240, 305)">
    <path d="M7 16v14H3V16h4zm3 14h14a3 3 0 0 0 3-3l2-9a3 3 0 0 0-3-3h-7V7a3 3 0 0 0-3-3l-6 12v17z" />
  </g>

  <!-- Glasses / Cool -->
  <g class="doodle" transform="translate(325, 315)">
    <circle cx="10" cy="12" r="8" />
    <circle cx="26" cy="12" r="8" />
    <line x1="18" y1="12" x2="18" y2="12" />
    <line x1="2" y1="10" x2="0" y2="7" />
    <line x1="34" y1="10" x2="36" y2="7" />
  </g>
</svg>
