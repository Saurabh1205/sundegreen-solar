<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e90ff"/>
      <stop offset="60%" stop-color="#87cefa"/>
      <stop offset="100%" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b304a"/>
      <stop offset="100%" stop-color="#1b6a9e"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sky)" />
  <!-- sun -->
  <circle cx="1100" cy="80" r="60" fill="#ffd54f" />
  <!-- panels -->
  <g transform="translate(200,240) rotate(-8)">
    <rect x="0" y="0" width="900" height="220" rx="6" fill="url(#panel)" stroke="#063047" stroke-width="6"/>
    <!-- panel lines -->
    <g stroke="#072235" stroke-width="2" opacity="0.9">
      <!-- vertical lines -->
      <g>
        <line x1="30" y1="10" x2="30" y2="210" />
        <line x1="90" y1="10" x2="90" y2="210" />
        <line x1="150" y1="10" x2="150" y2="210" />
        <line x1="210" y1="10" x2="210" y2="210" />
        <line x1="270" y1="10" x2="270" y2="210" />
        <line x1="330" y1="10" x2="330" y2="210" />
        <line x1="390" y1="10" x2="390" y2="210" />
        <line x1="450" y1="10" x2="450" y2="210" />
        <line x1="510" y1="10" x2="510" y2="210" />
        <line x1="570" y1="10" x2="570" y2="210" />
        <line x1="630" y1="10" x2="630" y2="210" />
        <line x1="690" y1="10" x2="690" y2="210" />
        <line x1="750" y1="10" x2="750" y2="210" />
      </g>
      <!-- horizontal lines -->
      <g>
        <line x1="10" y1="30" x2="890" y2="30" />
        <line x1="10" y1="70" x2="890" y2="70" />
        <line x1="10" y1="110" x2="890" y2="110" />
        <line x1="10" y1="150" x2="890" y2="150" />
        <line x1="10" y1="190" x2="890" y2="190" />
      </g>
    </g>
  </g>
  <!-- subtle ground -->
  <rect x="0" y="520" width="1400" height="80" fill="#3b7a3b" />
</svg>